<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fixfirst – from complaints to action</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#EDEFEA;--card:#FBFBF8;--ink:#17262B;--mut:#5C6B6F;--line:#D3D9D3;--teal:#0E4D5C;--yel:#F0B90B;--crit:#C23B22;--high:#E07B1A;--med:#4F7D8C;--low:#93A59E;--map:#F6F7F2;--river:#D5E6EA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121A1D;--card:#1A2528;--ink:#E7ECEA;--mut:#93A3A6;--line:#2C3A3E;--teal:#6FC0D2;--map:#17221F;--river:#1F3A44}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121A1D;--card:#1A2528;--ink:#E7ECEA;--mut:#93A3A6;--line:#2C3A3E;--teal:#6FC0D2;--map:#17221F;--river:#1F3A44}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",sans-serif;margin:0;line-height:1.15}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:14px 18px;border-bottom:3px solid var(--yel);background:var(--card)}
header h1{font-size:24px;font-weight:800}header small{color:var(--mut)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--ink);font:600 14px "Public Sans",sans-serif;padding:8px 12px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--teal);color:var(--bg)}
main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.ops{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
@media(max-width:820px){.two,.ops{grid-template-columns:1fr}}
label{display:block;font-weight:600;margin:12px 0 4px}
textarea,input[type=text],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:96px;resize:vertical}
button.btn{background:var(--teal);color:var(--bg);border:0;border-radius:6px;padding:11px 16px;font:600 15px "Public Sans",sans-serif;cursor:pointer}
button.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--yel);outline-offset:1px}
.map{width:100%;aspect-ratio:1;display:block;border-radius:8px;border:1px solid var(--line);background:var(--map)}
.map text{font:600 3px "Public Sans",sans-serif;fill:var(--mut)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;color:#fff}
.Critical{background:var(--crit)}.High{background:var(--high)}.Medium{background:var(--med)}.Low{background:var(--low);color:#102}
.st{background:var(--line);color:var(--ink)}
.q{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.q.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}
.q .sc{font:800 22px "Bricolage Grotesque",sans-serif;min-width:38px;text-align:center}
.mut{color:var(--mut);font-size:13.5px}.fac{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}
.brief{border-left:6px solid var(--yel)}.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl div{position:relative;margin-bottom:12px}.tl div:before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--teal)}
.step{padding:8px 0;border-bottom:1px solid var(--line)}.warn{background:rgba(240,185,11,.18);padding:8px 10px;border-radius:6px;font-size:13.5px}
ul{padding-left:20px;margin:6px 0}.leaflet-container{font:inherit}.al{background:var(--card);color:var(--ink);padding:1px 6px;border-radius:4px;font:600 12px "Public Sans",sans-serif;white-space:nowrap;border:1px solid var(--line);position:relative;left:-24px;top:-10px}
</style></head><body>
<header><h1>Fixfirst</h1><small>Citizen reports → ranked, explained, tracked. Synthetic data only.</small>
<nav id="nav"></nav></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CATS={water:{n:"Waterlogging & drains",base:14,kw:["waterlog","flood","drain","sewage","overflow","clog","gutter","stagnant"]},
road:{n:"Road damage",base:10,kw:["pothole","road","crack","tar ","footpath","sinkhole","caving","peeling"]},
waste:{n:"Waste & sanitation",base:8,kw:["garbage","waste","bin","trash","dump","smell","litter","rubbish"]},
light:{n:"Streetlight & power",base:10,kw:["streetlight","light","lamp","dark","wire","pole","electric","sparking"]},
supply:{n:"Water supply",base:10,kw:["tap","supply","pipe","leak","burst","no water","drinking"]},
other:{n:"Other",base:5,kw:["tree","dog","banner","noise","stray"]}};
const ORDER=Object.keys(CATS),TEAMS={water:"Drainage crew",road:"Roads dept",waste:"Sanitation",light:"Electrical",supply:"Water board",other:"Ward office"};
const ALLT=[...new Set([...Object.values(TEAMS),"Emergency response (24h)"])];
const AREAS=[["Hampankatta",30,35],["Kadri",70,25],["Bendoor",25,75],["Jeppu",72,72]];
const area=p=>AREAS.map(a=>[a[0],Math.hypot(a[1]-p.x,a[2]-p.y)]).sort((a,b)=>a[1]-b[1])[0][0];
const URG=[[/live wire|sparking|electrocut/,34,"live electrical hazard"],[/manhole/,28,"open manhole"],[/sinkhole|collaps|caving|accident|injur|skid/,22,"risk of injury or collapse"],[/ambulance|cannot pass|blocking/,18,"blocked emergency or road access"],[/knee.?deep|flood|sewage/,14,"flooding or sewage on the road"],[/dangerous/,16,"structural danger"],[/child|children|school/,10,"children nearby"],[/hospital|clinic/,10,"near a hospital"],[/smoke|burning/,10,"smoke or fire"],[/bus stop|market|junction|highway|underpass/,5,"busy public spot"]];
const STOP=new Set("the a an at on in of near is are to and for by with was were has have from since after very not".split(" "));
const toks=t=>new Set(t.toLowerCase().replace(/[^a-z ]/g," ").split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)));
const jac=(a,b)=>{let i=0;a.forEach(x=>b.has(x)&&i++);return i/(a.size+b.size-i||1)};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const NOW=Date.now(),DAY=864e5;let R=[],mine=[],sel=null,seq=1000,tab="report",pin=null,draft={text:"",addr:"",cat:"",photo:null},last=null,trackId="",geoMsg="";
const fmt=t=>new Date(t).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const get=id=>R.find(r=>r.id==id);
const statusOf=r=>r.dupOf?get(r.dupOf).status:r.status;
function classify(t){const l=t.toLowerCase();let best="other",n=0,hits=[];for(const c of ORDER){if(c=="other")continue;const h=CATS[c].kw.filter(k=>l.includes(k));if(h.length>n){n=h.length;best=c;hits=h}}
if(!n){hits=CATS.other.kw.filter(k=>l.includes(k));n=hits.length?1:0}return{cat:best,hits,conf:n>=2?"high":n==1?"medium":"low"}}
function ingest(o){const r={id:"CMP-"+(++seq),text:o.text,x:o.x,y:o.y,ts:o.ts,photo:o.photo||null,dups:[],dupOf:null,status:"New",log:[{s:"New",t:o.ts,n:"Report received"}]};
const c=classify(o.text);r.aiCat=c.cat;r.hits=c.hits;r.conf=c.conf;r.cat=o.cat||c.cat;
const s1=o.text.split(/[.!?\n]/)[0].trim();r.summary=(s1.length>85?s1.slice(0,82)+"…":s1);r.summary=r.summary[0].toUpperCase()+r.summary.slice(1);
r.tk=toks(o.text);let best=null,bs=0;
for(const p of R){if(p.dupOf||p.cat!=r.cat||p.status=="Resolved")continue;const d=dist(p,r),j=jac(p.tk,r.tk);
if(d<=9&&(j>=.18||d<=3)){const s=j+(9-d)/20;if(s>bs){bs=s;best=p;r.dupInfo={d:d.toFixed(1),j:Math.round(j*100)}}}}
if(best){r.dupOf=best.id;best.dups.push(r.id)}R.push(r);return r}
function rescore(){const P=R.filter(r=>!r.dupOf&&r.status!="Resolved");
for(const r of R){if(r.dupOf)continue;const f=[];let s=CATS[r.cat].base;f.push([CATS[r.cat].n+" baseline",s]);
let u=0;const l=r.text.toLowerCase();for(const[re,p,w]of URG)if(re.test(l)){u+=p;f.push([w,p])}
if(u>60){f.push(["urgency capped at 60",60-u]);u=60}s+=u;r.urg=u;
const n=P.filter(p=>p!==r&&dist(p,r)<=9).length;if(n){const d=Math.min(n*3,15);f.push([n+" other open report"+(n>1?"s":"")+" nearby",d]);s+=d}
if(r.dups.length){const d=Math.min(r.dups.length*4,12);f.push([r.dups.length+" duplicate report"+(r.dups.length>1?"s":"")+" merged",d]);s+=d}
const days=Math.floor((NOW-r.ts)/DAY);if(days>0){const d=Math.min(days,8);f.push(["open for "+days+" day"+(days>1?"s":""),d]);s+=d}
r.factors=f;r.score=Math.min(100,Math.round(s));r.level=r.score>=70?"Critical":r.score>=50?"High":r.score>=30?"Medium":"Low";
r.team=u>=28?"Emergency response (24h)":TEAMS[r.cat]}}
function clusters(){const P=R.filter(r=>!r.dupOf&&r.status!="Resolved"),par=P.map((_,i)=>i),f=i=>par[i]==i?i:(par[i]=f(par[i]));
for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++)if(dist(P[i],P[j])<=9)par[f(i)]=f(j);
const g={};P.forEach((p,i)=>(g[f(i)]=g[f(i)]||[]).push(p));
return Object.values(g).filter(m=>m.length>=3&&new Set(m.map(x=>x.cat)).size>=2).map(m=>{const cx=m.reduce((a,p)=>a+p.x,0)/m.length,cy=m.reduce((a,p)=>a+p.y,0)/m.length;
return{m,cx,cy,rad:Math.max(...m.map(p=>dist(p,{x:cx,y:cy})))+3,area:area({x:cx,y:cy}),cats:[...new Set(m.map(x=>x.cat))],total:m.reduce((a,p)=>a+p.score,0),dups:m.reduce((a,p)=>a+p.dups.length,0)}}).sort((a,b)=>b.total-a.total)}
/* synthetic data */
const SEED=[["Drain blocked near Kadri temple junction, water standing on road",70,24,6],["Drain is clogged at Kadri junction, stagnant water for days",71,26,5],["Big pothole filled with water outside Kadri market",69,27,4],["Road cracked and caving in near Kadri bus stop after rain",72,25,3],["Sewage overflowing onto road at Kadri junction, children walk through it to school",70,26,2],["Waterlogging at Kadri junction, knee deep after rain",71,24,1],["Open manhole, cover missing on Hampankatta main road, someone could fall",30,36,1],["Live wire hanging from pole near Jeppu school gate, sparking",73,70,0],["Fallen tree blocking lane near hospital in Bendoor, ambulance cannot pass",24,76,0],["Garbage bin overflowing at Hampankatta market, bad smell",31,34,5],["Waste bin full and trash on the street, Hampankatta market",29,35,4],["Garbage dumped on empty plot in Bendoor",27,78,7],["Bin not cleared for a week near Jeppu bus stop",70,73,6],["Streetlight not working on Bendoor main road, very dark at night",26,74,8],["Street lamp off near Bendoor hospital, dark stretch",25,75,7],["Streetlight flickering at Jeppu junction",74,71,3],["No water supply in Jeppu lane 3 since two days",71,74,2],["Pipeline leak flooding the lane near Jeppu school",72,72,1],["Drinking water pipe burst at Hampankatta, water wasted",33,38,3],["Pothole on Hampankatta road near bus stop, two-wheelers skid",28,33,9],["Large pothole at Hampankatta bus stop",29,34,8],["Footpath broken near Bendoor school",22,72,6],["Road surface peeling off at Jeppu highway",76,68,5],["Stray dogs gathering near Kadri park",68,30,4],["Illegal banner blocking view at Jeppu junction",74,73,3],["Drain overflow near Bendoor market",23,78,2],["Waterlogging near Hampankatta underpass after rain",32,37,2],["Garbage burning near Kadri, smoke spreading",66,22,1],["Streetlight pole leaning dangerously near Kadri school",68,26,2],["Road sinkhole forming near Bendoor hospital",25,77,1],["Pothole near Kadri junction",70,28,4]];
SEED.sort((a,b)=>b[3]-a[3]).forEach(s=>ingest({text:s[0],x:s[1],y:s[2],ts:NOW-s[3]*DAY-36e5*(s[1]%7)}));
function seedStat(start,steps){const r=R.find(r=>r.text.startsWith(start));let t=r.ts;steps.forEach(([s,n],i)=>{t+=(i+1)*5e6;r.log.push({s,t,n});r.status=s})}
seedStat("Garbage bin overflowing",[["Assigned","Assigned to Sanitation"],["In progress","Crew dispatched"],["Resolved","Bin cleared and sanitised"]]);
seedStat("Pothole on Hampankatta",[["Assigned","Assigned to Roads dept"],["In progress","Patching scheduled"]]);
seedStat("Streetlight not working",[["Assigned","Assigned to Electrical"]]);
rescore();
/* map: real OpenStreetMap tiles. Demo reports use offsets (1 unit = 60 m) from a movable origin */
const O={lat:0,lng:0},MU=60,MM=111320,cs=()=>Math.cos(O.lat*Math.PI/180);
const setO=(la,lo,x,y)=>{O.lat=la+y*MU/MM;O.lng=lo-x*MU/(MM*Math.cos(la*Math.PI/180))};setO(12.875,74.85,50,50);
const ll=p=>[O.lat-p.y*MU/MM,O.lng+p.x*MU/(MM*cs())];
const xy=(la,lo)=>({x:(lo-O.lng)*MM*cs()/MU,y:(O.lat-la)*MM/MU});
let maps=[];
function mapSVG(o){maps.push(o);return `<div class="map" id="${o.id}" role="application" aria-label="Map"></div>`}
function drawMaps(){const cols={Critical:"#C23B22",High:"#E07B1A",Medium:"#4F7D8C",Low:"#93A59E"};
for(const o of maps.splice(0)){if(typeof L=="undefined"){$("#"+o.id).innerHTML='<p class="mut" style="padding:16px">The map needs an internet connection to load.</p>';continue}
const m=L.map(o.id,{scrollWheelZoom:false});
{const bb=L.latLngBounds([ll({x:0,y:0}),ll({x:100,y:100})]);if(o.pin)bb.extend(ll(o.pin));m.fitBounds(bb)}
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(m);
AREAS.forEach(a=>L.marker(ll({x:a[1],y:a[2]}),{icon:L.divIcon({className:"",html:`<b class="al">${a[0]}</b>`}),interactive:false}).addTo(m));
if(o.clusters)for(const c of clusters())L.circle(ll({x:c.cx,y:c.cy}),{radius:c.rad*MU,color:"#0E4D5C",dashArray:"6 6",weight:2,fillColor:"#F0B90B",fillOpacity:.14}).addTo(m);
if(o.markers)for(const r of R.filter(r=>!r.dupOf)){const done=r.status=="Resolved",on=r.id==o.sel;
L.circleMarker(ll(r),{radius:5+r.score/12,color:on?"#17262B":"#fff",weight:on?3:1.5,fillColor:done?"#fff":cols[r.level],fillOpacity:done?.4:.9}).addTo(m).bindTooltip(r.id+": "+esc(r.summary)).on("click",()=>pick(r.id))}
if(o.pin)L.circleMarker(ll(o.pin),{radius:9,color:"#17262B",weight:2,fillColor:"#F0B90B",fillOpacity:1}).addTo(m);
if(o.id=="pm")m.on("click",e=>placePin(e.latlng.lat,e.latlng.lng,""))}}
const coords=p=>{const q=ll(p);return q[0].toFixed(4)+"° N, "+q[1].toFixed(4)+"° E"};
const chip=r=>`<span class="chip ${r.level}">${r.level}</span>`,stc=r=>`<span class="chip st">${statusOf(r)}</span>`;
/* views */
function nav(){$("#nav").innerHTML=[["report","Report"],["track","Track"],["ops","Operations"],["about","Limits & honesty"]].map(([k,l])=>`<button class="${tab==k?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}
function go(t){tab=t;render()}
function pick(id){sel=id;if(tab!="ops")tab="ops";render()}
function render(){nav();$("#app").innerHTML=({report:vReport,track:vTrack,ops:vOps,about:vAbout})[tab]();drawMaps();if(tab=="report")bindReport()}
function vReport(){const sg=draft.text.length>8?classify(draft.text):null;
return `<div class="two"><div class="card"><h2>Report a problem</h2>
<label for="tx">What is wrong?</label><textarea id="tx" placeholder="e.g. Drain blocked near the bus stop, water on the road">${esc(draft.text)}</textarea>
<div class="mut" id="sug">${sg?"AI suggests: "+CATS[sg.cat].n:"The AI suggests a category as you type."}</div>
<label for="ct">Category</label><select id="ct"><option value="">Let the AI choose</option>${ORDER.map(c=>`<option value="${c}" ${draft.cat==c?"selected":""}>${CATS[c].n}</option>`).join("")}</select>
<label for="ph">Photo (optional)</label><input type="file" id="ph" accept="image/*">${draft.photo?`<img src="${draft.photo}" alt="Attached photo" style="max-width:120px;margin-top:6px;border-radius:6px">`:""}
<div class="mut">Photos are stored with the report but not analysed by the AI in this prototype.</div>
<label for="ad">Address or landmark (mocked lookup: try “Kadri”)</label><input type="text" id="ad" value="${esc(draft.addr)}">
<button class="btn alt" type="button" onclick="locate()">Use my current location</button><p class="mut" id="gm">${geoMsg}</p><p class="mut">Or tap the map to drop a pin. ${pin?"Pin: "+coords(pin)+" ("+area(pin)+")":"No pin yet."}</p>
<button class="btn" onclick="submitR()">Send report</button></div>
<div>${mapSVG({id:"pm",pin})}<div class="mut" style="margin-top:6px">Map © OpenStreetMap contributors. Tap the map to place a pin.</div>
${last?resultCard(last):""}</div></div>`}
function bindReport(){$("#tx").oninput=e=>{draft.text=e.target.value;const t=draft.text.length>8?classify(draft.text):null;$("#sug").textContent=t?"AI suggests: "+CATS[t.cat].n:"The AI suggests a category as you type."};
$("#ct").onchange=e=>draft.cat=e.target.value;$("#ad").onchange=e=>{draft.addr=e.target.value;const a=AREAS.find(a=>draft.addr.toLowerCase().includes(a[0].toLowerCase()));if(a){pin={x:a[1],y:a[2]};render()}};
$("#ph").onchange=e=>{const f=e.target.files[0];if(f){draft.photo=URL.createObjectURL(f);render()}};
}
function placePin(la,lo,pre){let u=xy(la,lo),moved=false;if(u.x<-10||u.x>110||u.y<-10||u.y>110){setO(la,lo,70,26);u={x:70,y:26};moved=true}
geoMsg=(pre||"")+(moved?" The synthetic demo reports were moved to this area so you can try the full flow.":"");pin={x:+u.x.toFixed(1),y:+u.y.toFixed(1)};render()}
function locate(){if(!navigator.geolocation){geoMsg="This browser has no location access. Tap the map instead.";return render()}
geoMsg="Finding you…";render();
navigator.geolocation.getCurrentPosition(p=>{const la=p.coords.latitude,lo=p.coords.longitude,acc="Located within about "+Math.round(p.coords.accuracy)+" m.";placePin(la,lo,acc)},
e=>{geoMsg=e.code==1?"Location permission was denied. Allow it in the browser address bar, or tap the map instead.":"Could not get your location. Tap the map instead.";render()},{enableHighAccuracy:true,timeout:10000})}
function submitR(){if(draft.text.trim().length<10)return alert("Describe the problem in a few words.");if(!pin)return alert("Drop a pin on the map or enter a known landmark.");
const r=ingest({text:draft.text.trim(),x:pin.x,y:pin.y,ts:Date.now(),cat:draft.cat,photo:draft.photo});rescore();mine.push(r.id);last=r.id;trackId=r.id;draft={text:"",addr:"",cat:"",photo:null};pin=null;render();scrollTo(0,0)}
function factorsHTML(r){return r.factors.map(([w,p])=>`<div class="fac"><span>${esc(w)}</span><b>${p>0?"+":""}${p}</b></div>`).join("")}
function resultCard(id){const r=get(id),p=r.dupOf?get(r.dupOf):r;
return `<div class="card brief" style="margin-top:14px"><h3>${r.id} received</h3>
<div class="step"><b>1. Category:</b> ${CATS[r.cat].n}${r.cat!=r.aiCat?` (you chose this; AI would say ${CATS[r.aiCat].n})`:""} <span class="mut">· confidence ${r.conf}${r.hits.length?", matched: "+r.hits.join(", "):""}</span></div>
<div class="step"><b>2. Summary:</b> ${esc(r.summary)} <span class="mut">· ${area(r)}</span></div>
<div class="step"><b>3. Duplicate check:</b> ${r.dupOf?`Linked to ${r.dupOf}: ${r.dupInfo.d} map units away, ${r.dupInfo.j}% wording overlap. Your report adds weight to that issue.`:"No similar open report within range. This is a new issue."}</div>
<div class="step"><b>4. Priority:</b> ${chip(p)} ${p.score}/100 ${r.dupOf?`(shared with ${p.id})`:""}${factorsHTML(p)}</div>
<button class="btn" style="margin-top:10px" onclick="trackId='${r.id}';go('track')">Follow progress</button></div>`}
function vTrack(){const r=get(trackId.trim().toUpperCase()),p=r&&(r.dupOf?get(r.dupOf):r);
return `<div class="two"><div class="card"><h2>Track a report</h2><label for="ti">Report ID</label><input type="text" id="ti" value="${esc(trackId)}" placeholder="CMP-1001" onchange="trackId=this.value;render()">
<p class="mut">Your reports this session:</p>${mine.length?mine.map(i=>`<button class="btn alt" style="margin:0 6px 6px 0" onclick="trackId='${i}';render()">${i}</button>`).join(""):'<p class="mut">None yet. Any seeded ID such as CMP-1010 also works.</p>'}</div>
<div class="card">${r?`<h3>${r.id} ${stc(r)}</h3><p>${esc(r.text)}</p><p class="mut">${CATS[r.cat].n} · ${area(r)}</p>
${r.dupOf?`<div class="warn">Merged with ${p.id}. You will see that issue’s progress.</div>`:""}
<div class="tl" style="margin-top:12px">${p.log.map(l=>`<div><b>${l.s}</b> <span class="mut">${fmt(l.t)}</span><br>${esc(l.n)}</div>`).join("")}</div>`:`<p class="mut">${trackId?"No report with that ID.":"Enter a report ID to see its status."}</p>`}</div></div>`}
function briefText(c){const n=c.m.length,names=c.cats.map(k=>CATS[k].n.toLowerCase());
const hyp=c.cats.includes("water")&&c.cats.includes("road")?" Drain trouble beside road damage often means water is undermining the surface, so clear the drain before patching.":"";
const urgent=c.m.filter(p=>p.urg>=28);
return `${c.area}: ${n} open issues${c.dups?" (+"+c.dups+" duplicate reports)":""} across ${names.join(", ")}.${urgent.length?" Urgent: "+urgent.map(p=>p.id).join(", ")+".":""}${hyp} Cluster priority total ${c.total}.`}
function vOps(){const Q=R.filter(r=>!r.dupOf&&r.status!="Resolved").sort((a,b)=>b.score-a.score),C=clusters(),a=Q[0],b=Q[1];
const why=a&&b?(()=>{const bn=new Set(b.factors.map(f=>f[0])),k=a.factors.filter(f=>!bn.has(f[0])&&f[1]>0).sort((x,y)=>y[1]-x[1])[0];return `${a.id} (${a.score}) ranks above ${b.id} (${b.score})${k?" mainly because of: "+k[0]+" (+"+k[1]+")":""}.`})():"";
const s=get(sel);
return `<div class="card brief"><h2>Action brief</h2>${C[0]?`<p><b>Hotspot.</b> ${esc(briefText(C[0]))}</p>`:""}
${a?`<p><b>Fix first.</b> ${a.id}: ${esc(a.summary)} (${area(a)}). Suggested owner: ${a.team}. ${why}</p>`:"<p>Nothing open.</p>"}
<p class="mut">Generated by rules and templates over the data, not by a language model.</p></div>
<div class="ops"><div>${mapSVG({id:"om",markers:1,clusters:1,sel})}<div class="mut" style="margin:6px 0 12px">Dot size and colour = priority. Dashed rings = detected clusters. Hollow = resolved. ${R.filter(r=>r.dupOf).length} duplicates merged into their parent report.</div>${s?detail(s):""}</div>
<div><h3 style="margin-bottom:8px">Priority queue (${Q.length} open)</h3>${Q.map(r=>`<div class="q ${r.id==sel?"sel":""}" onclick="pick('${r.id}')"><div class="sc">${r.score}</div><div><b>${esc(r.summary)}</b><br><span class="mut">${r.id} · ${area(r)} · ${CATS[r.cat].n}</span><br>${chip(r)} ${stc(r)}${r.dups.length?` <span class="mut">+${r.dups.length} dup</span>`:""}</div></div>`).join("")}</div></div>`}
const NEXT={New:["Assigned","Assign"],Assigned:["In progress","Start work"],"In progress":["Resolved","Mark resolved"]};
function detail(r){const nx=NEXT[r.status];
return `<div class="card"><h3>${r.id} ${chip(r)} ${stc(r)}</h3><p>${esc(r.text)}</p><p class="mut">${CATS[r.cat].n} · ${area(r)} · ${coords(r)}</p>
<div class="bar"><i style="width:${r.score}%;background:var(--${r.level.toLowerCase()})"></i></div><b>Why ${r.score}/100</b>${factorsHTML(r)}
${r.dups.length?`<p class="mut">Merged duplicates: ${r.dups.join(", ")}</p>`:""}
${nx?`${r.status=="New"?`<label for="tm">Assign to (suggested: ${r.team})</label><select id="tm">${ALLT.map(t=>`<option ${t==r.team?"selected":""}>${t}</option>`).join("")}</select>`:""}
<label for="nt">Note for the citizen (optional)</label><input type="text" id="nt"><p><button class="btn" onclick="act('${r.id}')">${nx[1]}</button></p>`:""}
<div class="tl" style="margin-top:10px">${r.log.map(l=>`<div><b>${l.s}</b> <span class="mut">${fmt(l.t)}</span> ${esc(l.n)}</div>`).join("")}</div></div>`}
function act(id){const r=get(id),[s]=NEXT[r.status],t=$("#tm")?$("#tm").value:"",n=$("#nt").value.trim();
r.status=s;r.log.push({s,t:Date.now(),n:n||(s=="Assigned"?"Assigned to "+t:s=="In progress"?"Work started":"Issue resolved")});rescore();render()}
function vAbout(){return `<div class="card"><h2>Limits & honesty</h2><h3 style="margin-top:12px">Real</h3><ul><li>Every report you submit is processed live by the pipeline in this page: category, summary, duplicate check, priority, clustering and brief.</li><li>Assign and status changes update the operator queue and the citizen tracking view.</li></ul>
<h3>Mocked</h3><ul><li>All 31 starting reports are synthetic, with deliberate duplicates, urgent hazards and clusters. No personal data.</li><li>The map uses real OpenStreetMap tiles, but the 31 starting reports sit at invented spots. When you use your location, the demo reports are moved to your area. The address box only knows four made-up area names.</li><li>No SMS, email or real authority integration. Citizen “notifications” are just the tracking page.</li><li>Nothing is saved after you close the page.</li></ul>
<h3>How the AI works</h3><ul><li><b>Category:</b> keyword scoring. Misses unusual wording and mixed reports.</li><li><b>Summary:</b> first sentence, trimmed. No language model.</li><li><b>Duplicates:</b> same category, within 9 map units, and either 18% word overlap or within 3 units. Can miss paraphrases and can merge neighbouring but separate problems.</li><li><b>Priority:</b> category baseline + urgency phrases + nearby open reports + merged duplicates + age, capped at 100. Weights are hand-set, not learned, and should be reviewed by officials.</li><li><b>Clusters:</b> open reports linked within 9 units, at least 3 reports and 2 categories.</li><li>Photos are not analysed.</li></ul>
<h3>Next</h3><ul><li>Embedding-based duplicate detection and an LLM for summaries, with human review.</li><li>Real map tiles and geocoding, photo analysis, accounts and notifications, and tuning weights against past outcomes.</li></ul></div>`}
render();
